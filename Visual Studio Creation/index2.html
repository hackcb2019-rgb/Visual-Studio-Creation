<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK Productivity Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --accent: #38BDF8;
            --accent-hover: #0284C7;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155;
            --danger: #EF4444;
            --success: #22C55E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .date-badge {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Metrics Dashboard */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            border-radius: 12px;
            text-align: center;
        }

        .metric-card span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .metric-card strong {
            font-size: 1.6rem;
            color: var(--text-main);
        }

        /* Task Form */
        .input-section {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.85rem 1.2rem;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button.btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Task List */
        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .task-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1rem 1.2rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.15s, opacity 0.2s;
        }

        .task-item:hover {
            transform: translateY(-2px);
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .task-text {
            font-size: 1rem;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .btn-delete {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div>
                <h1>Apex Hub</h1>
                <p class="date-badge" id="currentDate">Loading date...</p>
            </div>
        </header>

        <!-- Dashboard Statistics -->
        <section class="metrics-grid">
            <div class="metric-card">
                <span>Total Tasks</span>
                <strong id="totalCount">0</strong>
            </div>
            <div class="metric-card">
                <span>Completed</span>
                <strong id="completedCount" style="color: var(--success);">0</strong>
            </div>
            <div class="metric-card">
                <span>Pending</span>
                <strong id="pendingCount" style="color: var(--accent);">0</strong>
            </div>
        </section>

        <!-- Input Area -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new objective or task..." onkeypress="handleKeyPress(event)">
            <button class="btn-primary" onclick="addTask()">Add Task</button>
        </div>

        <!-- Dynamic List -->
        <ul class="task-list" id="taskList">
            <li class="empty-state" id="emptyState">No active tasks. Add one above to get started.</li>
        </ul>
    </div>

    <script>
        let tasks = [];

        // Initialize Date Display
        const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', options);

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            
            // Clear existing elements except keep logic clean
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                taskList.appendChild(emptyState);
                emptyState.style.display = 'block';
            } else {
                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    li.innerHTML = `
                        <div class="task-content">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                            <span class="task-text">${escapeHtml(task.text)}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteTask(${index})">Delete</button>
                    `;
                    taskList.appendChild(li);
                });
            }

            updateMetrics();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            if (text !== "") {
                tasks.push({ text: text, completed: false });
                input.value = '';
                renderTasks();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        function updateMetrics() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('pendingCount').textContent = pending;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
